# Expected outcomes only. Actual observations belong in evidence/.
# This is a claim registry, not an executable checker or enforcement mechanism.
specification_id: chat-mvp
version: "0.1"
date: "2026-11-03"
design: system-design.md
guidance: ../../evaluation-pattern.yaml
initial_review: evidence/2026-11-03-design-review.md

status_semantics:
  requirement_confirmation: Whether the requirement was agreed, derived, or proposed.
  unverified: Satisfaction is unknown; no sufficient applicable execution evidence exists.
  verified: Evidence supports the claim only within its recorded conditions.
  failed: Applicable evidence contradicts an acceptance criterion.
  not_applicable: A record explains why the claim does not apply to the evaluated decision.

sources:
  U-01:
    kind: confirmed_user_choices
    statement: People messaging, working MVP, public signup, private one-to-one chat, responsive web.
  U-02:
    kind: confirmed_user_choices
    statement: Device-bound credentials, E2EE, one browser profile, no recovery; restricted authenticator compatibility accepted.
  U-03:
    kind: confirmed_user_choices
    statement: Exact username discovery, accepted contact requests, initially unverified chat, optional verification, selected report evidence.
  U-04:
    kind: confirmed_user_choices
    statement: Reuse Matrix, prefer managed hosting, pilot with 100 registered and 20 concurrent users.
  P-01:
    kind: user_supplied_implementation_plan
    statement: React/Vite, Node/Fastify, PostgreSQL, private Synapse gateway, blocking, reports, operator CLI, deployment configurations, and specified evaluation scenarios.
  D-01:
    kind: proposed_design_details
    statement: API and state contracts, timeout defaults, workload shape, and investigation gates in system-design.md.

conditions:
  supported_client:
    - Stable HTTPS origin and RP ID, except explicitly configured localhost development.
    - A tested WebAuthn authenticator reporting non-backup-eligible credentials with user verification.
    - A browser with persistent IndexedDB, WebAssembly, and exclusive store locking.
    - One supported browser profile with its original crypto store intact.
  privacy_boundary:
    - Trusted frontend delivery and uncompromised participant endpoints.
    - Initial unverified contact identity has not been independently authenticated.
    - Metadata and explicitly submitted report text are outside ordinary message-body secrecy.
    - No promise of recipient restraint, metadata anonymity, or hardware-bound message keys.
  pilot:
    registered_users: 100
    concurrent_users: 20
    accepted_pairs: 10
    aggregate_messages_per_second: 1
    measured_duration_seconds: 600
    maximum_body_bytes: 4096
    workload_shape_confirmation: proposed_design_default
    environment: Must be recorded by the evidence producer; no instance sizes or results are assumed.

dependencies:
  DEP-AUTH:
    promise: SimpleWebAuthn exposes verified origin, RP, user-verification and backup eligibility results.
    investigation: I-01
  DEP-CRYPTO:
    promise: The pinned Matrix SDK supports persistent encryption and verification without enabling recovery or replacement devices.
    investigation: I-01 and I-04
  DEP-GATEWAY:
    promise: All necessary SDK operations can be routed through a restrictive gateway without alternate public access.
    investigation: I-02
  DEP-STORE:
    promise: Application transactions plus recoverable Synapse operations preserve canonical room and event identities.
    investigation: I-03
  DEP-HOST:
    promise: The selected hosting configuration provides the intended isolation, persistence, and measured pilot capacity.
    investigation: I-05

claims:
  - id: AUTH-001
    type: invariant
    statement: Only a valid device-bound credential with user verification can establish a new authenticated session.
    requirement_confirmation: confirmed_with_derived_checks
    sources: [U-02, P-01]
    acceptance_criteria:
      - Reject backup-eligible credentials even if they are not currently backed up.
      - Reject invalid signatures, missing user verification, wrong origins or RP IDs, and expired or consumed challenges.
      - Concurrent verification of one challenge produces at most one successful consumption.
    conditions: [supported_client]
    components: [authentication, application_database]
    dependencies: [DEP-AUTH]
    checks: [CHECK-AUTH]
    fitness_function: Execute real WebAuthn flows and negative/concurrent challenge tests.
    status: unverified
    evidence: []

  - id: AUTH-002
    type: invariant
    statement: Unauthenticated, expired, revoked, or suspended sessions cannot perform protected operations.
    requirement_confirmation: derived_from_confirmed_outcomes
    sources: [U-01, U-02, P-01]
    acceptance_criteria:
      - Application APIs and Matrix gateway reject unauthorized sessions.
      - Logout and suspension invalidate both cookie sessions and gateway bearer tokens for new operations.
      - Cookie-authenticated mutations reject cross-origin or invalid CSRF requests.
    conditions: [supported_client]
    components: [authentication, gateway, operator_cli]
    dependencies: [DEP-AUTH, DEP-GATEWAY]
    checks: [CHECK-AUTH, CHECK-OPERATIONS]
    fitness_function: Exercise every protected interface before login and after expiry, logout, and suspension.
    status: unverified
    evidence: []

  - id: DEVICE-001
    type: constraint
    statement: Each account has one messaging identity in one supported browser profile and no recovery mechanism.
    requirement_confirmation: confirmed_with_derived_checks
    sources: [U-02, P-01]
    acceptance_criteria:
      - Explain data-loss consequences before registration completes.
      - Refresh and reauthentication reuse the original device and decrypt existing history.
      - Missing crypto state, another browser profile, or replacement identity keys cannot silently initialize a new identity for the account.
      - A second tab cannot concurrently open the SDK crypto store.
      - No password fallback, key backup, extra-device enrollment, or account-reset route is exposed.
    conditions: [supported_client]
    components: [browser, crypto_adapter, authentication, gateway]
    dependencies: [DEP-AUTH, DEP-CRYPTO, DEP-GATEWAY]
    checks: [CHECK-DEVICE]
    fitness_function: Exercise store loss, reload, logout/login, multiple tabs, and identity-replacement API attempts.
    status: unverified
    evidence: []

  - id: CONTACT-001
    type: outcome
    statement: A registered user can find an exact username and establish a conversation only with recipient acceptance.
    requirement_confirmation: confirmed_with_derived_checks
    sources: [U-01, U-03, P-01]
    acceptance_criteria:
      - Unique normalized usernames cannot be claimed concurrently by different accounts.
      - A pending or rejected request permits no conversation text sends.
      - Only the request recipient can accept or reject; crossed requests do not imply consent.
      - Repeated or concurrent acceptance exposes one canonical ready conversation with exactly the intended pair.
    conditions: [supported_client]
    components: [contact_api, application_database, room_provisioner, gateway]
    dependencies: [DEP-GATEWAY, DEP-STORE]
    checks: [CHECK-CONTACTS]
    fitness_function: Execute accepted, rejected, crossed, unauthorized, duplicate, and interrupted request workflows.
    status: unverified
    evidence: []

  - id: ACCESS-001
    type: invariant
    statement: A third account cannot read a conversation, join it, add members, or use alternative Matrix routes to bypass pair policy.
    requirement_confirmation: confirmed_with_derived_checks
    sources: [U-01, U-03, P-01]
    acceptance_criteria:
      - Direct room, history, event, membership, key, and to-device attempts are checked independently of UI visibility.
      - Guessing a room or account ID never grants access.
      - Unknown routes, unsupported API versions, wildcard device destinations, and alternative public Synapse access are denied.
    conditions: [supported_client]
    components: [gateway, room_provisioner, synapse, deployment]
    dependencies: [DEP-GATEWAY, DEP-HOST]
    checks: [CHECK-AUTHORIZATION, CHECK-DEPLOYMENT]
    fitness_function: Run a three-account adversarial API suite and external network-isolation checks.
    status: unverified
    evidence: []

  - id: MESSAGE-001
    type: outcome
    statement: Accepted contacts can exchange encrypted text live and retrieve accepted history after refresh or reconnect.
    requirement_confirmation: confirmed
    sources: [U-01, U-02, P-01]
    acceptance_criteria:
      - Both intended browsers decrypt exchanged messages through the real gateway and Synapse path.
      - Accepted history remains readable after pagination, refresh, and temporary disconnection with local keys intact.
      - Connection and send failures are visible; acceptance by the service is not displayed as a read receipt.
    conditions: [supported_client, privacy_boundary]
    components: [browser, crypto_adapter, gateway, synapse]
    dependencies: [DEP-CRYPTO, DEP-GATEWAY, DEP-STORE]
    checks: [CHECK-MESSAGING]
    fitness_function: Run two-browser encrypted conversation and history/reconnect scenarios.
    status: unverified
    evidence: []

  - id: MESSAGE-002
    type: invariant
    statement: Retrying one logical message does not create duplicate accepted conversation events in the supported device lifecycle.
    requirement_confirmation: derived_from_confirmed_outcomes
    sources: [U-01, P-01]
    acceptance_criteria:
      - Retain transaction identity, endpoint, and device identity after lost responses and refreshes.
      - Reconcile pending sends and deduplicate received history by event ID.
      - Failed messages are neither silently lost nor retried under a new logical ID.
    conditions: [supported_client]
    components: [outbox, crypto_adapter, gateway, synapse]
    dependencies: [DEP-CRYPTO, DEP-STORE]
    checks: [CHECK-RETRY]
    fitness_function: Drop responses after upstream acceptance and count resulting events across reload, retry, and token renewal.
    status: unverified
    evidence: []

  - id: PRIVACY-001
    type: invariant
    statement: Normal messaging exposes neither message plaintext nor client private keys to service-side storage, transport handling, or diagnostics.
    requirement_confirmation: confirmed_with_scoped_threat_model
    sources: [U-02, P-01]
    acceptance_criteria:
      - Encryption occurs before transport, and plaintext Matrix message events are rejected.
      - Inspectable service requests, database records, logs, traces, and error paths contain no canary message bodies or client private keys.
      - Only explicitly previewed report text is allowed as report disclosure; ordinary messaging has no plaintext fallback.
      - Record that endpoint compromise, malicious frontend replacement, metadata exposure, and initial contact impersonation are not disproved by this check.
    conditions: [supported_client, privacy_boundary]
    components: [crypto_adapter, gateway, synapse, telemetry, report_api]
    dependencies: [DEP-CRYPTO, DEP-GATEWAY, DEP-HOST]
    checks: [CHECK-PRIVACY]
    fitness_function: Inspect the real encrypted workflow with canary bodies, protocol payload analysis, and logging/database review, including failures.
    status: unverified
    evidence: []

  - id: TRUST-001
    type: invariant
    statement: Users can distinguish initial unverified contacts from verified identities, and a changed previously trusted identity stops sending.
    requirement_confirmation: confirmed_with_derived_checks
    sources: [U-03, P-01]
    acceptance_criteria:
      - Initially unverified encrypted chat is allowed and clearly labelled.
      - Verification succeeds only after the SDK verification exchange and explicit user comparison.
      - Cancellation or mismatch never results in verified status.
      - Unexpected trusted-identity change blocks new and queued sends without a replacement-device shortcut.
    conditions: [supported_client, privacy_boundary]
    components: [browser, crypto_adapter, gateway]
    dependencies: [DEP-CRYPTO, DEP-GATEWAY]
    checks: [CHECK-TRUST]
    fitness_function: Complete real two-browser verification and inject cancellation, mismatch, reload, and identity-change cases.
    status: unverified
    evidence: []

  - id: BLOCK-001
    type: invariant
    statement: A block prevents future pair requests and sends in both directions at the gateway policy boundary.
    requirement_confirmation: confirmed_with_design_boundary
    sources: [U-01, P-01, D-01]
    acceptance_criteria:
      - No operation authorized after the block takes effect can send to the pair through room or to-device paths.
      - Serialize competing send/block decisions; classify requests already authorized before the block rather than promise retraction.
      - Reconnect and local retries recheck block state; unblocking does not automatically transmit queued messages.
      - Existing history stays accessible to its original participants; one user's unblock cannot remove the other's block.
    conditions: [supported_client]
    components: [block_api, gateway, outbox, application_database]
    dependencies: [DEP-GATEWAY, DEP-STORE]
    checks: [CHECK-BLOCKING]
    fitness_function: Race sends and blocks, then attempt direct, queued, cross-direction, and to-device writes.
    status: unverified
    evidence: []

  - id: REPORT-001
    type: outcome
    statement: A participant can report another participant using only deliberately selected and previewed message evidence.
    requirement_confirmation: confirmed_with_derived_checks
    sources: [U-03, P-01]
    acceptance_criteria:
      - Preview matches the report payload; cancellation sends no report.
      - Retry of a report ID does not create a second report.
      - Submission attaches no surrounding history, private keys, or routine diagnostic dump.
      - Only authorized operators access stored report text; routine telemetry excludes it.
    conditions: [supported_client, privacy_boundary]
    components: [browser, report_api, application_database, operator_cli]
    dependencies: [DEP-GATEWAY]
    checks: [CHECK-REPORTING, CHECK-PRIVACY]
    fitness_function: Compare selected text, preview, actual submission, operator access, and logs; test cancellation and retries.
    status: unverified
    evidence: []

  - id: OPERATIONS-001
    type: outcome
    statement: An operator can review reports and suspend accounts while observing service health without collecting normal message content.
    requirement_confirmation: accepted_plan
    sources: [P-01]
    acceptance_criteria:
      - Report review and suspension are restricted and audited without copying evidence into audit logs.
      - Suspension rejects new protected operations and revokes sessions.
      - Metadata-only health, error, provisioning, and queue measurements expose failures without message bodies or tokens.
    conditions: [supported_client, privacy_boundary]
    components: [operator_cli, authentication, gateway, telemetry]
    dependencies: [DEP-GATEWAY, DEP-HOST]
    checks: [CHECK-OPERATIONS, CHECK-PRIVACY]
    fitness_function: Exercise CLI authorization, report review, suspension, dependency outages, and telemetry inspection.
    status: unverified
    evidence: []

  - id: UX-001
    type: outcome
    statement: Users can complete the MVP workflow on desktop and narrow mobile layouts using accessible controls and a keyboard.
    requirement_confirmation: confirmed_with_derived_checks
    sources: [U-01, P-01]
    acceptance_criteria:
      - Complete signup, requests, chat, retry, block, verification, and report preview without inaccessible controls.
      - Pending, failed, disconnected, unverified, and lost-local-data states are understandable and not conveyed only by color.
    conditions: [supported_client]
    components: [browser]
    dependencies: [DEP-AUTH, DEP-CRYPTO]
    checks: [CHECK-UX]
    fitness_function: Perform browser automation plus manual responsive and keyboard review; record tested viewports and devices.
    status: unverified
    evidence: []

  - id: PERFORMANCE-001
    type: constraint
    statement: The proposed pilot target is p95 send-invocation-to-recipient-decryption latency at most two seconds.
    requirement_confirmation: proposed_target_from_accepted_plan
    sources: [U-04, P-01, D-01]
    acceptance_criteria:
      - Measure the declared pilot workload with real encryption and a common test-runner clock.
      - Report missing deliveries, failures, retries, sample counts, percentiles, resource use, warmup, and environment.
      - Do not exclude missing messages from the outcome assessment or substitute mocked encryption.
    conditions: [supported_client, pilot]
    components: [browser, crypto_adapter, gateway, synapse, deployment]
    dependencies: [DEP-CRYPTO, DEP-GATEWAY, DEP-HOST]
    checks: [CHECK-PERFORMANCE]
    fitness_function: Run the ten-minute 20-client encrypted messaging workload and assess the scoped proposed target.
    status: unverified
    evidence: []

  - id: DEPLOYMENT-001
    type: invariant
    statement: Only the gateway is public, and service restart preserves required server-side identity and message state.
    requirement_confirmation: accepted_plan_with_derived_checks
    sources: [P-01]
    acceptance_criteria:
      - Synapse, administration interfaces, and databases cannot be reached through another public route.
      - Federation, guest/password signup, extra-device enrollment, and backup APIs remain unavailable.
      - Persist server signing material and databases across container restarts; no promise of client-key recovery follows.
      - Stable origin, RP ID, and Matrix server name are recorded before pilot registration.
    conditions: [supported_client]
    components: [deployment, gateway, synapse]
    dependencies: [DEP-GATEWAY, DEP-HOST]
    checks: [CHECK-DEPLOYMENT]
    fitness_function: Validate Compose/managed configuration, inspect external reachability, and run restart/persistence checks.
    status: unverified
    evidence: []

checks:
  CHECK-AUTH: Real/virtual authenticator success, backup flags, signature, UV, origin/RP, challenge replay/expiry/races, session and CSRF rejection.
  CHECK-DEVICE: Two profiles and multiple tabs; refresh, logout/login, local-store loss, replacement-key upload, no extra-device or backup endpoint.
  CHECK-CONTACTS: Exact lookup and signup uniqueness; pending/rejected/crossed requests; unauthorized and concurrent acceptance; provisioning failure injection.
  CHECK-AUTHORIZATION: Three-account direct API attacks across room reads, writes, key exchange, membership, route versions, and wildcard destinations.
  CHECK-MESSAGING: Real two-browser encrypted sends, accepted history, pagination, visible errors, refresh, and reconnect.
  CHECK-RETRY: Lost upstream responses, stable transaction scope across restarts/token changes, and event-count reconciliation.
  CHECK-PRIVACY: Canary plaintext and key-path inspection of payloads, stores, traces, SDK logging, telemetry, exceptions, and explicit report disclosure.
  CHECK-TRUST: Verification success/cancellation/mismatch; persistence and trusted-identity replacement with queued-send rejection.
  CHECK-BLOCKING: Pair-policy ordering under competing send/block operations, to-device bypass attempts, reconnect, and two-direction unblock behavior.
  CHECK-REPORTING: Selection/preview/payload agreement, cancellation, report idempotency, and restricted operator visibility.
  CHECK-OPERATIONS: Restricted CLI review and suspension; session revocation; dependency failures; content-free audit/metrics.
  CHECK-UX: Responsive and keyboard checks of normal, forbidden, and exceptional user flows with recorded browser/viewports.
  CHECK-PERFORMANCE: Real 20-client ten-minute pilot measurement with explicit denominator, common clock, losses, errors, and resource limits.
  CHECK-DEPLOYMENT: Private reachability, denied alternative routes, persisted identities, container restarts, and pinned deployment configuration.

open_questions:
  - id: OPEN-INTEGRATION
    question: Can the pinned SDK and Synapse versions satisfy device reuse, verification without recovery, restricted transport, and canonical room recovery?
    effect: Investigations I-01 through I-04 block acceptance of the corresponding design claims.
    owner_role: implementing_engineer
    decision_due: Before treating the proposed integration as accepted design.
  - id: OPEN-HOSTING
    question: What stable domain, deployment region, instance sizes, operating budget, and backup schedule will the pilot use?
    effect: Local feasibility work can proceed; public deployment and cost/capacity claims remain unknown.
    owner_role: project_owner_and_operator
    decision_due: Before provisioning pilot infrastructure or registering pilot identities.
  - id: OPEN-RETENTION
    question: What retention and deletion schedules apply to ciphertext, metadata, selected report evidence, logs, and server backups?
    effect: No retention promise is made; resolve and publish policy before enabling public signup.
    owner_role: project_owner
    decision_due: Before public pilot launch.

evaluation_policy:
  - Each run names a bounded outcome, decision, claims, conditions, and stopping rule.
  - Requirement confirmation never substitutes for evidence of satisfaction.
  - A timeout, missing artifact, incompatible environment, or incomplete check leaves the claim unverified.
  - Accept only within the evidenced scope; preserve failures, counterexamples, and uncertainty.
  - Specification changes and implementation repair have separate rationales and review records.
  - Reevaluate affected claims when code, requirements, dependencies, identity configuration, workload, or operating assumptions change.
