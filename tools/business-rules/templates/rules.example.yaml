app: example-shop
state: idea

# Single source of truth: code and tests read numbers and static data from here.
# Never restate a number in a rule statement or in code. Name it as a parameter.

# Conditions that rules and measurements hold under. Expire them with valid_until.
assumptions:
  - id: A-peak-load
    kind: workload
    statement: Peak checkout load is 50 orders per second, 10% of them with a discount.
    status: confirmed
    source: {kind: stakeholder, ref: "ops review"}
    decided_by: Sam (ops)
    decided_on: 2026-11-04
    valid_until: 2027-06-30

# Numbers and settings. origin says where the value comes from; mutability says
# whether it is fixed when the app is built (build) or may change while it runs (runtime).
parameters:
  - id: P-max-discount
    description: Largest discount a customer may receive.
    value: 15
    unit: percent
    status: confirmed
    origin: decided
    mutability: runtime
    changeable_by: [business_owner]
    bounds: {min: 0, max: 50}          # every change, even at runtime, must stay inside this
    source: {kind: stakeholder, ref: "pricing owner, kickoff call"}
    decided_by: Dana (pricing owner)
    decided_on: 2026-11-04
    revision: 1

  - id: P-checkout-p95-budget
    description: Checkout response time the business accepts at the 95th percentile.
    value: 800
    unit: ms
    status: confirmed
    origin: decided
    mutability: build
    source: {kind: stakeholder, ref: "founder, kickoff call"}
    decided_by: Dana (pricing owner)
    decided_on: 2026-11-04
    assumptions: [A-peak-load]

  - id: P-checkout-p95-observed
    description: Latest measured checkout response time at the 95th percentile.
    value: 420
    unit: ms
    status: confirmed
    origin: measured
    mutability: build
    changeable_by: [measurement]       # a newer measurement may replace the value without a new decision
    bounds: {min: 0, max: 60000}
    source: {kind: measurement, ref: "load test run 17"}
    decided_by: Sam (ops)              # approved the method and where the number is recorded
    decided_on: 2026-11-04
    measurement:
      date: 2026-11-04
      workload: A-peak-load
      environment: staging, 2 vCPU
      tool: k6
      period: 10 minutes
      sample_size: 30000
    assumptions: [A-peak-load]

  - id: P-conversion-target
    description: Share of first-time buyers who should reach the confirmation page.
    value: 90
    unit: percent
    status: proposed                   # a guess until someone decides it
    origin: estimated
    mutability: build
    source: {kind: inferred, ref: common conversion benchmark}

# Static reference data, tracked by version instead of copied into code.
datasets:
  - id: D-tax-rates
    description: Sales tax rate per region.
    version: "2026.1"
    mutability: runtime
    owner: Finance
    review_by: 2027-01-31

rules:
  - id: DISC-1
    statement: WHEN a discount is applied, THE SYSTEM SHALL reject any discount above P-max-discount.
    status: confirmed
    revision: 1
    required: true
    rationale: Margin policy.
    source:
      kind: stakeholder
      ref: "pricing owner, kickoff call"
    decided_by: Dana (pricing owner)
    decided_on: 2026-11-04
    uses:
      parameters: [P-max-discount]
    scenarios:
      - kind: required
        name: 10% accepted
        given: price 100
        when: discount 10%
        then: total 90
      - kind: forbidden
        name: 20% rejected
        given: price 100
        when: discount 20%
        then: error and price unchanged
      - kind: exceptional
        name: negative discount
        given: price 100
        when: discount -5%
        then: error
    check:
      method: test
      ref: tests/test_discount.py
      strength: sampled
    evidence:
      result: passed
      ref: ci run 123
      date: 2026-11-04
      limitations: three sampled inputs only
      provenance:
        code_version: abc1234
        rule_revision: 2026-11-04
        environment: ci, python 3.13
        workload: unit inputs 10, 20, -5
        tool: pytest

  - id: UX-1
    statement: Checkout feels trustworthy to first-time buyers.
    status: confirmed
    revision: 1
    required: false
    rationale: Important, but no available check can decide it. Kept optional until proxies exist.
    source:
      kind: stakeholder
      ref: "founder, kickoff call"
    decided_by: Dana (pricing owner)
    decided_on: 2026-11-04
    scenarios:
      - kind: required
        name: buyer completes first order
        given: a new visitor
        when: they buy once
        then: they reach the confirmation page without support contact
      - kind: forbidden
        name: surprise charge
        given: a new visitor
        when: they reach payment
        then: no cost appears that was not shown earlier
    evidence:
      result: unmeasurable
      reason: Trust is subjective; no direct metric.
      proxies:
        - UX-2

  - id: UX-2
    statement: At least P-conversion-target of first-time buyers who start checkout reach the confirmation page.
    status: proposed
    required: false
    rationale: Candidate proxy for UX-1; threshold is a guess.
    uses:
      parameters: [P-conversion-target]
    source:
      kind: inferred
      ref: common conversion benchmark

  - id: DISC-2
    statement: Discounts are applied before tax.
    status: proposed
    rationale: Common convention; not yet decided.
    depends_on:
      - DISC-1
    uses:
      datasets: [D-tax-rates]
    source:
      kind: inferred
      ref: domain convention
    scenarios:
      - kind: required
        name: pre-tax
        given: price 100 and tax 10%
        when: discount 10%
        then: total 99

  - id: DISC-3
    statement: Which products are excluded from discounts?
    status: open

  - id: PERF-1
    statement: At peak load, checkout response time at the 95th percentile stays within P-checkout-p95-budget.
    status: confirmed
    revision: 1
    required: false
    rationale: The budget is decided; the observed value is a measurement, kept in a separate parameter.
    source:
      kind: stakeholder
      ref: "founder, kickoff call"
    decided_by: Dana (pricing owner)
    decided_on: 2026-11-04
    uses:
      parameters: [P-checkout-p95-budget, P-checkout-p95-observed]
      assumptions: [A-peak-load]
    scenarios:
      - kind: required
        name: within budget at peak
        given: A-peak-load
        when: a load test runs for 10 minutes
        then: p95 is at or below P-checkout-p95-budget
      - kind: forbidden
        name: unmeasured claim
        given: no measurement under A-peak-load
        when: someone states the budget is met
        then: the claim stays unknown
    check:
      method: measurement
      ref: load test run 17
      strength: sampled
